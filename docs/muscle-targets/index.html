  .top-dd > summary:hover { color:#fff; }
  .top-dd.is-active > summary { color:#fff; }
  .top-dd-menu {

  .top-dd-menu a { display:block; padding:.4rem .65rem; border-radius:6px; }
  .top-dd-menu a:hover { background:#334155; color:#fff; }
  .top-dd-menu a[aria-current="page"] { background:#059669; color:#fff; }
  .top h1 { margin:.5rem 0 .25rem; font-size:1.9rem; font-weight:900; letter-spacing:-.02em; }

  .wrap-main { max-width:1080px; margin:0 auto; padding:20px 16px 60px; }

    box-shadow:0 4px 18px rgba(15,23,42,.04);

  .search-wrap svg {
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; color:#94a3b8; pointer-events:none;
  }
  #search {
    width:100%; padding:10px 40px 10px 38px; border:1px solid var(--line);
    border-radius:10px; font:inherit; background:var(--card); color:var(--ink);
  }
  #search:focus { outline:2px solid #a7f3d0; outline-offset:1px; border-color:var(--accent); }
  #clear-search {
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; border:none; border-radius:8px; background:transparent;
    color:#94a3b8; cursor:pointer; font-size:1.1rem; line-height:1; display:none;
  }
  #clear-search:hover { background:var(--head); color:var(--ink); }
  #clear-search.visible { display:inline-flex; align-items:center; justify-content:center; }

  .day-filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .day-filters .label {
    font-size:.72rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.04em; margin-right:2px;
  }
  .day-btn {
    appearance:none; border:1px solid var(--line); background:#fff; color:var(--muted);
    font:inherit; font-size:.75rem; font-weight:700; padding:.4rem .75rem;
    border-radius:9999px; cursor:pointer;

  .day-btn:hover { border-color:#94a3b8; color:var(--ink); }
  .day-btn.on { background:#0f172a; border-color:#0f172a; color:#fff; }

  .meta-row {
    display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
    justify-content:space-between; margin:0 0 .75rem;

  .count { color:var(--muted); font-size:.85rem; margin:0; }
  .reset-btn {

  }
  .reset-btn.visible { display:inline; }
  .reset-btn:hover { text-decoration:underline; }

  #list { display:flex; flex-direction:column; gap:14px; }

  .group {
    border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden;
  }
  .group[hidden] { display:none; }
  .group-head {
    display:grid; grid-template-columns:minmax(160px,1fr) minmax(0,2fr) minmax(120px,.7fr);
    gap:12px 16px; padding:14px 16px;
    background:linear-gradient(180deg, #f1f5f9 0%, #fff 100%);
    border-bottom:1px solid var(--line); align-items:start;

  .group-title {
    margin:0; font-size:1.05rem; font-weight:900; letter-spacing:-.02em; color:var(--ink);

  .yt-name {
    color:inherit; text-decoration:underline dotted; text-decoration-color:#94a3b8;

  }
  .yt-name:hover { color:#b91c1c; text-decoration-color:#b91c1c; }
  .group-meta {

  }
  .find-link {

    font-size:.72rem; font-weight:700; color:#b91c1c; text-decoration:none;

  .targets { width:100%; border-collapse:collapse; font-size:.875rem; }
  .targets th {
    text-align:left; padding:8px 16px; font-size:.7rem; font-weight:700;
    color:var(--muted); text-transform:uppercase; letter-spacing:.04em;
    background:var(--head); border-bottom:1px solid var(--line);

  .targets tr[hidden] { display:none; }
  .col-muscle { width:26%; }
  .col-days { width:18%; }

  .muscle-name { font-weight:800; font-size:.95rem; color:#065f46; letter-spacing:-.01em; }
  .muscle-nest { display:flex; align-items:flex-start; gap:8px; }

  .day-chip {
    display:inline-flex; align-items:center; margin:2px 4px 2px 0;
    font-size:.72rem; font-weight:700; padding:.35rem .7rem; border-radius:9999px;

  .day-chip:hover { background:#334155; }
  .day-chip.active-filter { background:var(--accent); }

  .videos { display:flex; flex-wrap:wrap; gap:10px; }
  .yt-card {

  .yt-card .play {

  .empty-state strong { display:block; color:var(--ink); font-size:1rem; margin-bottom:.35rem; }

</style>

  const ALL_DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const state = { query: "", day: "All" };

  function videoId(url) {
    const patterns = [
      /youtube\.com\/shorts\/([^?&#]+)/,
      /youtu\.be\/([^?&#]+)/,
      /youtube\.com\/watch\?v=([^?&#]+)/,
      /youtube\.com\/embed\/([^?&#]+)/,
    ];
    for (const re of patterns) {
      const m = String(url || "").match(re);
      if (m) return m[1];
    }
    return "";
  }

  function thumbUrl(id) {
    return id ? `https://img.youtube.com/vi/${encodeURIComponent(id)}/mqdefault.jpg` : "";
  }

  function ytSearchUrl(find) {
    const q = String(find || "").trim();
    if (!q) return "";
    return `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function normalize(s) {
    return String(s || "").toLowerCase().trim();
  }

  function videoHay(videos) {
    return (videos || []).map((v) => v.title || "").join(" ");
  }

  function targetHay(t) {
    return normalize([t.muscle, t.find, videoHay(t.videos), (t.days || []).join(" ")].join(" "));
  }

  function dayHit(days) {
    return state.day === "All" || (days || []).includes(state.day);
  }

  function queryHit(text) {
    const q = normalize(state.query);
    return !q || text.includes(q);
  }

  function visibleTargets(g) {
    const q = normalize(state.query);
    const groupHit = q && normalize([g.name || "", g.find || "", videoHay(g.videos)].join(" ")).includes(q);
    return (g.targets || []).filter((t) => {
      if (!dayHit(t.days)) return false;
      if (!q) return true;
      if (groupHit) return true;
      return targetHay(t).includes(q);
    });
  }

  function groupVisible(g) {
    const kids = visibleTargets(g);
    if (kids.length) return true;
    const selfDay = dayHit(g.days);
    const selfQuery = queryHit(normalize([g.name || "", g.find || "", videoHay(g.videos)].join(" ")));
    return !!(g.name && selfDay && selfQuery && ((g.videos && g.videos.length) || !g.targets?.length));
  }

  function allDaysUsed() {
    const used = new Set();
    GROUPS.forEach((g) => {
      (g.days || []).forEach((d) => used.add(d));
      (g.targets || []).forEach((t) => (t.days || []).forEach((d) => used.add(d)));
    });
    return used;
  }

  function countAllTargets() {
    return GROUPS.reduce((n, g) => n + (g.targets || []).length, 0);
  }

  function countAllVideos() {
    return GROUPS.reduce((n, g) => {
      n += g.videos?.length || 0;
      (g.targets || []).forEach((t) => (n += t.videos?.length || 0));
      return n;
    }, 0);
  }

  function nameButton(label, find, className) {
    const safe = escapeHtml(label);
    const q = escapeHtml(find || "");
    if (!find) return `<span class="${className}">${safe}</span>`;
    return `<button type="button" class="yt-name ${className}" data-find="${q}" title="Search YouTube: ${q}">${safe}</button>`;
  }

  function findMoreLink(find) {
    if (!find) return "";
    const href = escapeHtml(ytSearchUrl(find));
    return `<a class="find-link" href="${href}" target="_blank" rel="noopener noreferrer">Find more on YouTube →</a>`;
  }

  function renderVideos(videos, extraClass) {
    if (!videos || !videos.length) return '<span class="empty-videos">No Shorts yet</span>';
    const cls = extraClass ? `yt-card ${extraClass}` : "yt-card";
    return (
      '<div class="videos">' +
      videos.map((v) => {
        const id = videoId(v.url);
        const thumb = thumbUrl(id);
        const label = escapeHtml(v.title || "Watch Short");
        const href = escapeHtml(v.url);
        const img = thumb ? `<img src="${thumb}" alt="" loading="lazy" />` : "";
        return (
          `<a class="${cls}" href="${href}" target="_blank" rel="noopener noreferrer">` +
          `<span class="thumb">${img}<span class="play"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></span>` +
          `<span class="label">${label}</span></a>`
        );
      }).join("") +
      "</div>"
    );
  }

  function renderDays(days) {
    if (!days || !days.length) return '<span class="empty-videos">TBD</span>';
    return days.map((d) => {
      const on = state.day === d ? " active-filter" : "";
      return `<button type="button" class="day-chip${on}" data-day="${escapeHtml(d)}" title="Show ${escapeHtml(d)} only">${escapeHtml(d)}</button>`;
    }).join("");
  }

  function renderGroup(g, gi) {
    const kids = g.targets || [];
    const head =
      `<div class="group-head">` +
      `<div>${nameButton(g.name, g.find, "group-title")}<p class="group-meta">${kids.length} target${kids.length === 1 ? "" : "s"}</p>${findMoreLink(g.find)}</div>` +
      `<div>${renderVideos(g.videos, "group-vid")}</div>` +
      `<div class="group-days">${renderDays(g.days)}</div>` +
      `</div>`;

    const body =
      `<table class="targets"><thead><tr>` +
      `<th class="col-muscle">Specific muscle</th><th>YouTube Shorts</th><th class="col-days">Training days</th>` +
      `</tr></thead><tbody>` +
      kids.map((t, ti) => {
        const nameCell =
          `<div class="muscle-nest"><span class="nest-line" aria-hidden="true"></span>` +
          `<div>${nameButton(t.muscle, t.find, "muscle-name")}${findMoreLink(t.find)}</div></div>`;
        return (
          `<tr data-gi="${gi}" data-ti="${ti}">` +
          `<td>${nameCell}</td>` +
          `<td>${renderVideos(t.videos)}</td>` +
          `<td>${renderDays(t.days)}</td></tr>`
        );
      }).join("") +
      `</tbody></table>`;

    return `<section class="group" data-gi="${gi}">${head}${body}</section>`;
  }

  function buildDayButtons() {
    const used = allDaysUsed();
    const buttons = ["All", ...ALL_DAYS].map((d) => {
      const on = state.day === d ? " on" : "";
      const has = d === "All" || used.has(d);
      const hint = d !== "All" && !has ? ' title="No targets on this day yet"' : "";
      return `<button type="button" class="day-btn${on}" data-day="${d}"${hint}>${d}</button>`;
    }).join("");
    document.getElementById("day-filters").innerHTML = '<span class="label">Day</span>' + buttons;
  }

  function syncUrl() {
    const params = new URLSearchParams();
    if (state.query) params.set("q", state.query);
    if (state.day !== "All") params.set("day", state.day);
    const qs = params.toString();
    history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
  }

  function readUrl() {
    const params = new URLSearchParams(location.search);
    state.query = params.get("q") || "";
    const day = params.get("day") || "All";
    state.day = ALL_DAYS.includes(day) || day === "All" ? day : "All";
    document.getElementById("search").value = state.query;
  }

  function applyFilters() {
    let visibleTargetsN = 0;
    let visibleVideosN = 0;
    let visibleGroupsN = 0;

    document.querySelectorAll("#list .group").forEach((section) => {
      const gi = Number(section.dataset.gi);
      const g = GROUPS[gi];
      const kids = visibleTargets(g);
      const kidSet = new Set(kids);

      section.querySelectorAll("tbody tr").forEach((tr) => {
        const ti = Number(tr.dataset.ti);
        const t = g.targets[ti];
        const ok = kidSet.has(t);
        tr.hidden = !ok;
        if (ok) {
          visibleTargetsN += 1;
          visibleVideosN += t.videos?.length || 0;
          tr.querySelector("td:last-child").innerHTML = renderDays(t.days);
        }
      });

      const show = groupVisible(g);
      section.hidden = !show;
      if (show) {
        visibleGroupsN += 1;
        if (dayHit(g.days)) visibleVideosN += g.videos?.length || 0;
        const daysEl = section.querySelector(".group-days");
        if (daysEl) daysEl.innerHTML = renderDays(g.days);
      }
    });

    const totalT = countAllTargets();
    const totalV = countAllVideos();
    const filtered = !!(state.query || state.day !== "All");
    const dayLabel = state.day === "All" ? "" : ` · ${state.day}`;
    document.getElementById("count").textContent = filtered
      ? `Showing ${visibleGroupsN} group${visibleGroupsN === 1 ? "" : "s"} · ${visibleTargetsN} target${visibleTargetsN === 1 ? "" : "s"} · ${visibleVideosN} Short${visibleVideosN === 1 ? "" : "s"}${dayLabel}`
      : `${GROUPS.length} groups · ${totalT} targets · ${totalV} Shorts`;

    document.getElementById("reset-filters").classList.toggle("visible", filtered);
    document.getElementById("clear-search").classList.toggle("visible", !!state.query);
    document.querySelectorAll(".day-btn").forEach((btn) => {
      btn.classList.toggle("on", btn.dataset.day === state.day);
    });

    const empty = visibleGroupsN === 0;
    document.getElementById("list").style.display = empty ? "none" : "";
    document.getElementById("empty").classList.toggle("visible", empty);
    document.getElementById("empty-msg").textContent =
      state.day !== "All" && !state.query
        ? `Nothing scheduled for ${state.day} yet.`
        : "Try another search or day.";
    syncUrl();
  }

  function renderList() {
    document.getElementById("list").innerHTML = GROUPS.map((g, i) => renderGroup(g, i)).join("");
  }

  function setDay(day) {
    state.day = day === state.day && day !== "All" ? "All" : day;
    applyFilters();
  }

  function resetFilters() {
    state.query = "";
    state.day = "All";
    document.getElementById("search").value = "";
    applyFilters();
  }

  function openFind(find) {
    const url = ytSearchUrl(find);
    if (url) window.open(url, "_blank", "noopener,noreferrer");
  }

  readUrl();
  buildDayButtons();
  renderList();
  applyFilters();

  document.getElementById("search").addEventListener("input", (e) => {
    state.query = e.target.value;
    applyFilters();
  });
  document.getElementById("clear-search").addEventListener("click", () => {
    state.query = "";
    document.getElementById("search").value = "";
    document.getElementById("search").focus();
    applyFilters();
  });
  document.getElementById("day-filters").addEventListener("click", (e) => {
    const btn = e.target.closest(".day-btn");
    if (btn) setDay(btn.dataset.day);
  });
  document.getElementById("list").addEventListener("click", (e) => {
    const findBtn = e.target.closest(".yt-name");
    if (findBtn) {
      openFind(findBtn.dataset.find);
      return;
    }
    const chip = e.target.closest(".day-chip");
    if (chip) setDay(chip.dataset.day);
  });
  document.getElementById("reset-filters").addEventListener("click", resetFilters);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement?.tagName !== "INPUT") {
      e.preventDefault();
      document.getElementById("search").focus();
    }
    if (e.key === "Escape" && (state.query || state.day !== "All")) resetFilters();
  });
</script>
